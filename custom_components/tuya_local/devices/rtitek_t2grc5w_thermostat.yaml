name: Thermostat
products:
  - id: t3cugk89gnr3sjgj
    manufacturer: RTI-Tek
    model: T2G-RC5W
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: mode
            conditions:
              - dps_val: auto
                value: auto
              - dps_val: manual
                value: heat
      - id: 2
        name: mode
        type: string
        hidden: true
      - id: 16
        name: temperature
        type: integer
        unit: C
        range:
          min: 50
          max: 950
        mapping:
          - scale: 10
            step: 5
      - id: 19
        name: max_temperature
        type: integer
        mapping:
          - scale: 10
      - id: 23
        name: temperature_unit
        type: string
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 24
        name: current_temperature
        type: integer
        mapping:
          - scale: 10
      - id: 26
        name: min_temperature
        type: integer
        mapping:
          - scale: 10
      - id: 36
        name: hvac_action
        type: string
        mapping:
          - dps_val: open
            value: heating
          - dps_val: close
            value: idle
  - entity: sensor
    class: battery
    dps:
      - id: 35
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -99
          max: 99
        mapping:
          - scale: 10
  - entity: switch
    translation_key: anti_frost
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 23
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: number
    translation_key: maximum_temperature
    category: config
    class: temperature
    dps:
      - id: 19
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 950
        mapping:
          - scale: 10
            step: 10
  - entity: number
    translation_key: minimum_temperature
    category: config
    class: temperature
    dps:
      - id: 26
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 680
        mapping:
          - scale: 10
            step: 10
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 40
        type: boolean
        name: lock
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 45
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 45
        type: bitfield
        name: fault_code
      - id: 45
        name: description
        type: bitfield
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Internal probe fault
          - dps_val: 2
            value: External probe fault
          - dps_val: 4
            value: Sensor fault
          - dps_val: 8
            value: Low battery
          - dps_val: 16
            value: Temperature fault
          - dps_val: 32
            value: RF connection lost
          - dps_val: 64
            value: Low battery, update blocked
      - id: 105
        name: product_info
        type: string
        optional: true
      # support_features bitmask (read-only, set bit = capability built into
      # this firmware template): bit0 week program, bit1 day program, bit2
      # towel rail, bit3 timer, bit4 power stats, bit5 temperature unit
      # (dp23), bit6 battery (dp35), bit7 door card, bit8 frost protection
      # (dp10), bit9 vent temperature, bit10 Wi-Fi, bit11 night mode, bit12
      # temperature calibration (dp27), bit13 chart stats, bit14 sensor type
      # (dp117), bit15 output delay (dp121), bit17 TP3-BL screen module,
      # bit18 TP3-BL forced heat module.
      - id: 122
        name: support_features
        type: integer
        optional: true
  - entity: number
    name: Temperature hysteresis
    class: temperature_delta
    category: config
    dps:
      - id: 112
        type: integer
        name: value
        optional: true
        unit: C
        range:
          min: 0
          max: 100
        mapping:
          - scale: 10
  - entity: switch
    name: Floor limit
    category: config
    dps:
      - id: 115
        type: boolean
        name: switch
        optional: true
  - entity: number
    name: Floor temperature limit
    class: temperature
    category: config
    dps:
      - id: 116
        type: integer
        name: value
        optional: true
        unit: C
        range:
          min: 350
          max: 800
        mapping:
          - scale: 10
  - entity: sensor
    name: Sensor type
    class: enum
    category: diagnostic
    dps:
      - id: 117
        type: string
        name: sensor
        optional: true
        mapping:
          - dps_val: IN
            value: Built-in
          - dps_val: OUT
            value: External
          - dps_val: ALL
            value: Built-in and external
  - entity: sensor
    name: External temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 118
        type: integer
        name: sensor
        optional: true
        unit: C
        mapping:
          - scale: 10
  - entity: binary_sensor
    name: Floor limit active
    category: diagnostic
    dps:
      - id: 119
        type: boolean
        name: sensor
        optional: true
  - entity: sensor
    name: Floor temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 120
        type: integer
        name: sensor
        optional: true
        unit: C
        mapping:
          - scale: 10
  - entity: number
    name: Output delay
    class: duration
    category: config
    dps:
      - id: 121
        type: integer
        name: value
        optional: true
        unit: min
        range:
          min: 0
          max: 5
  - entity: select
    name: Working week
    icon: "mdi:calendar-clock"
    category: config
    dps:
      - id: 31
        type: string
        name: option
        optional: true
        mapping:
          - dps_val: "5_2"
            value: "5 days"
          - dps_val: "6_1"
            value: "6 days"
          - dps_val: "7"
            value: "7 days"
  - entity: text
    # Weekly schedule (week_program3): fixed 8 segments of 4 bytes each
    # (hour, minute, temperature*10 as big-endian uint16) = 32 bytes.
    # First 6 segments are the weekday program, last 2 are the weekend
    # program. dp31 (work_days) only selects which days use which
    # program; it does not change this layout.
    translation_key: schedule
    category: config
    hidden: true
    dps:
      - id: 30
        type: base64
        optional: true
        name: value
